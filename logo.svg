<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="90" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Stylized Buildings / Chart bars representing Finance + City -->
  <path d="M120 280 L120 160 L170 160 L170 280 Z" fill="#ffffff" opacity="0.9" />
  <path d="M180 280 L180 120 L230 120 L230 280 Z" fill="#ffffff" opacity="0.9" />
  <path d="M240 280 L240 200 L290 200 L290 280 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Upward Trend Arrow -->
  <path d="M100 200 L170 110 L220 150 L280 80 L310 80 L310 110 L230 190 L180 150 Z" fill="#10b981" filter="url(#shadow)"/>
</svg>
